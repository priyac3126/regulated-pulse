<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Arizona &amp; Texas</title>
  <desc id="desc">Outlines of Arizona and Texas beneath a medical cross and scales of justice.</desc>
  <rect width="600" height="600" fill="#102c46"/>
  <!-- Arizona -->
  <path d="M170 215 L285 215 L285 425 L235 450 L170 360 Z" fill="#3f7f82" stroke="#e8e6df" stroke-width="4" stroke-linejoin="round"/>
  <!-- Texas -->
  <path d="M330 215 L390 215 L390 265 L430 265 L430 310 L410 350 L430 400 L390 450 L360 440 L335 405 L315 390 L295 350 L285 305 L300 275 L315 255 L330 255 Z" fill="#b85c3b" stroke="#e8e6df" stroke-width="4" stroke-linejoin="round"/>
  <!-- Medical cross -->
  <path d="M300 72 V112 M280 92 H320" stroke="#e8e6df" stroke-width="7" stroke-linecap="round"/>
  <!-- Scales of justice -->
  <path d="M300 112 V172 M270 132 H330 M270 132 L258 166 M330 132 L342 166 M282 132 L270 166 M318 132 L330 166" stroke="#e8e6df" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M246 166 Q258 190 270 166 M330 166 Q342 190 354 166" stroke="#e8e6df" stroke-width="4" fill="none"/>
  <path d="M286 180 H314 L306 166 H294 Z" fill="#e8e6df"/>
  <!-- Caption -->
  <text x="300" y="520" text-anchor="middle" fill="#e8e6df" font-family="Georgia, 'Source Serif 4', serif" font-size="52" letter-spacing="1">Arizona &amp; Texas</text>
</svg>
