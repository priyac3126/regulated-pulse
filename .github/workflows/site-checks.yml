name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check local references and generated articles
        run: python3 scripts/check_site.py

      - name: Run Lighthouse (mobile)
        run: >-
          npx --yes lighthouse@12.6.0 https://theregulatedpulse.com
          --chrome-flags="--headless --no-sandbox"
          --output=html --output=json
          --output-path=./lighthouse-mobile --quiet

      - name: Run Lighthouse (desktop)
        run: >-
          npx --yes lighthouse@12.6.0 https://theregulatedpulse.com
          --preset=desktop
          --chrome-flags="--headless --no-sandbox"
          --output=html --output=json
          --output-path=./lighthouse-desktop --quiet

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-*.report.*
          if-no-files-found: warn
          retention-days: 14
